name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload validated plugin files
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-template-children-updater-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
      - name: Confirm committed runtime is current
        run: git diff --exit-code -- main.js
